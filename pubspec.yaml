name: personal_website
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.0.0 
  flutter_web_plugins:
    sdk: flutter
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/

  fonts:
    - family: VCROSDMono
      fonts:
        - asset: assets/fonts/VCR-OSD-MONO.ttf
    - family: BroshK
      fonts:
        - asset: assets/fonts/BroshK.ttf