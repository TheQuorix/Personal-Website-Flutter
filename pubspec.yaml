name: personal_website
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  go_router: ^18.0.1 
  flutter_web_plugins:
    sdk: flutter
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  dio: ^5.7.0
  provider: ^6.1.5+1
  flutter_riverpod: ^3.4.3
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/

  fonts:
    - family: VCROSDMono
      fonts:
        - asset: assets/fonts/VCR-OSD-MONO.ttf
    - family: BroshK
      fonts:
        - asset: assets/fonts/BroshK.ttf